name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: windows-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Verify audit standard
              run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-audit-standard.ps1

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Install frontend dependencies
              run: npm ci

            - name: Run frontend quality gate
              run: npm run lint

            - name: Check frontend types
              run: npm run typecheck

            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high

            - name: Run frontend tests
              run: npm test

            - name: Run 1000-task performance baseline
              run: npm run test:performance

            - name: Build frontend
              run: npm run build

            - name: Run browser smoke tests
              run: npm run test:e2e

            - name: Check Rust formatting
              working-directory: src-tauri
              run: cargo fmt --check

            - name: Check Rust
              working-directory: src-tauri
              run: cargo check --locked

            - name: Check Rust coding conventions
              working-directory: src-tauri
              run: cargo clippy --all-targets --locked -- -D warnings

            - name: Test Rust
              working-directory: src-tauri
              run: cargo test --locked

    rust-security:
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Install RustSec scanner
              run: cargo install cargo-audit --version 0.22.2 --locked

            - name: Populate complete crates.io index
              run: cargo fetch --locked
              working-directory: src-tauri

            - name: Audit Rust dependencies
              run: cargo audit --file src-tauri/Cargo.lock --deny yanked
