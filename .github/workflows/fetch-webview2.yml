name: Fetch verified WebView2 runtime

on:
    workflow_dispatch:
    push:
        branches: [codex/audit-release-20261006-api]
        paths: [.github/workflows/fetch-webview2.yml]

permissions:
    contents: read

jobs:
    fetch-runtime:
        runs-on: windows-latest
        timeout-minutes: 12
        steps:
            - name: Download official x64 standalone runtime without executing it
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $uri = 'https://go.microsoft.com/fwlink/?linkid=2124701'
                  $output = Join-Path $env:GITHUB_WORKSPACE 'verified-runtime'
                  New-Item -ItemType Directory -Path $output | Out-Null
                  $file = Join-Path $output 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
                  $head = Invoke-WebRequest -Uri $uri -Method Head -TimeoutSec 60
                  $resolved = $head.BaseResponse.RequestMessage.RequestUri
                  if ($resolved.Scheme -ne 'https' -or $resolved.Host -ne 'msedge.sf.dl.delivery.mp.microsoft.com' -or $resolved.AbsolutePath -notmatch '^/filestreamingservice/files/[^/]+/MicrosoftEdgeWebView2RuntimeInstallerX64.exe$') {
                      throw "Unexpected Microsoft download target: $resolved"
                  }
                  Invoke-WebRequest -Uri $resolved.AbsoluteUri -OutFile $file -TimeoutSec 300
                  $signature = Get-AuthenticodeSignature -LiteralPath $file
                  if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
                      throw 'Invalid Microsoft Authenticode signature'
                  }
                  $item = Get-Item -LiteralPath $file
                  if ($item.Length -lt 50MB) { throw 'Not a full standalone installer' }
                  [ordered]@{
                      source = $uri
                      resolved = $resolved.AbsoluteUri
                      sha256 = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
                      bytes = $item.Length
                      version = $item.VersionInfo.ProductVersion
                      signature = [string]$signature.Status
                      publisher = $signature.SignerCertificate.Subject
                      run = $env:GITHUB_RUN_ID
                      sourceCommit = $env:GITHUB_SHA
                      fetchedAtUtc = [DateTime]::UtcNow.ToString('o')
                  } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $output 'provenance.json') -Encoding utf8
                  Get-Content (Join-Path $output 'provenance.json')
            - uses: actions/upload-artifact@v4
              with:
                  name: verified-webview2-x64
                  path: verified-runtime/*
                  if-no-files-found: error
                  retention-days: 7

    build-offline-candidate:
        needs: fetch-runtime
        runs-on: windows-latest
        timeout-minutes: 30
        env:
            TEMP: ${{ github.workspace }}/.candidate-temp
            TMP: ${{ github.workspace }}/.candidate-temp
        steps:
            - uses: actions/checkout@v6
            - name: Prepare isolated temporary directory
              shell: pwsh
              run: New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
            - uses: actions/setup-node@v6
              with:
                  node-version: '24.15.0'
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
            - name: Validate source and build unsigned offline candidate
              shell: pwsh
              run: |
                  npm ci
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  npm run lint
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  npm run release:check
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  npm test -- --maxWorkers=2
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  npm run tauri -- build --bundles nsis -- --locked
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
            - name: Verify embedded runtime and record package provenance
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $script = 'src-tauri/target/release/nsis/x64/installer.nsi'
                  $text = Get-Content -LiteralPath $script -Raw
                  if ($text -notmatch '!define INSTALLWEBVIEW2MODE "offlineInstaller"') { throw 'Not offline mode' }
                  $runtime = [regex]::Match($text, '!define WEBVIEW2INSTALLERPATH "([^"]+)"').Groups[1].Value
                  if (-not $runtime) { throw 'No embedded runtime path' }
                  $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath
                  $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
                  $result = & scripts/verify-windows-runtime.ps1 -DumpbinPath $dumpbin -BinaryPath @('src-tauri/target/release/easy-project.exe','src-tauri/target/release/easyproject-mcp.exe') -WebViewInstallerPath $runtime
                  $bundle = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe')
                  if ($bundle.Count -ne 1 -or $bundle[0].Length -lt 50MB) { throw 'Missing complete offline package' }
                  $out = 'offline-candidate'
                  New-Item -ItemType Directory $out | Out-Null
                  Copy-Item $bundle[0].FullName $out
                  [ordered]@{
                      sourceCommit = $env:GITHUB_SHA
                      run = $env:GITHUB_RUN_ID
                      packageName = $bundle[0].Name
                      packageSHA256 = (Get-FileHash $bundle[0].FullName).Hash
                      packageBytes = $bundle[0].Length
                      packageSignature = [string](Get-AuthenticodeSignature $bundle[0].FullName).Status
                      runtimeAndImports = $result
                  } | ConvertTo-Json -Depth 5 | Set-Content "$out/provenance.json" -Encoding utf8
                  Get-Content "$out/provenance.json"
            - uses: actions/upload-artifact@v4
              with:
                  name: unsigned-windows-offline-candidate
                  path: offline-candidate/*
                  if-no-files-found: error
                  retention-days: 7
