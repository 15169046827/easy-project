name: Release desktop

on:
    push:
        tags: ['v*', '!v*-beta.*', '!v*-internal.*']
    workflow_dispatch:
        inputs:
            internal_test:
                description: Build a separate unsigned internal-test draft
                type: boolean
                default: false
            internal_number:
                description: New internal candidate number (2 or higher; existing drafts are protected)
                type: string
                default: '2'
            public_beta:
                description: Build a protected unsigned public-beta draft (publish separately after verification)
                type: boolean
                default: false
            beta_number:
                description: New beta number (1 or higher; existing drafts are protected)
                type: string
                default: '1'
            verify_beta2_assets_only:
                description: Read-only verification bridge for exact beta.2 assets; does not build or publish
                type: boolean
                default: false

permissions:
    contents: write

concurrency:
    group: release-desktop
    cancel-in-progress: false

jobs:
    verify-beta2-assets:
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_beta2_assets_only == true }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            # One-time user authorization; restore read after beta.2 verification.
            contents: write
            actions: read
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
            - name: Verify exact previously gated candidate and original assets
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node scripts/verify-beta2-assets.mjs
            - uses: actions/upload-artifact@v4
              with:
                  name: verified-original-beta2-assets
                  path: .verified-beta2/*
                  if-no-files-found: error
                  retention-days: 14

    validate:
        if: ${{ inputs.verify_beta2_assets_only != true }}
        runs-on: windows-latest
        timeout-minutes: 30
        env:
            TEMP: ${{ github.workspace }}/.validation-temp
            TMP: ${{ github.workspace }}/.validation-temp
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Prepare non-C test temporary directory
              run: |
                  if ([IO.Path]::GetPathRoot($env:TEMP) -ieq 'C:\') { throw 'Validation requires a non-C workspace' }
                  New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null

            - name: Verify audit standard
              run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-audit-standard.ps1

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Install frontend dependencies
              run: npm ci

            - name: Validate release metadata
              run: npm run release:check

            - name: Run frontend quality gate
              run: npm run lint

            - name: Check frontend types
              run: npm run typecheck

            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high

            - name: Audit development and build dependencies
              run: npm audit --audit-level=high

            - name: Run frontend tests
              run: npm test

            - name: Run 1000-task performance baseline
              run: npm run test:performance

            - name: Build frontend
              run: npm run build

            - name: Run browser smoke tests
              run: npm run test:e2e:production

            - name: Check Rust formatting
              working-directory: src-tauri
              run: cargo fmt --check

            - name: Check Rust coding conventions
              working-directory: src-tauri
              run: cargo clippy --all-targets --locked -- -D warnings

            - name: Test Rust
              working-directory: src-tauri
              run: cargo test --locked

    rust-security:
        if: ${{ inputs.verify_beta2_assets_only != true }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Install RustSec scanner
              run: cargo install cargo-audit --version 0.22.2 --locked

            - name: Populate complete crates.io index
              run: cargo fetch --locked
              working-directory: src-tauri

            - name: Audit Rust dependencies
              run: cargo audit --file src-tauri/Cargo.lock --deny yanked

    prepare:
        needs: [validate, rust-security]
        runs-on: windows-latest
        outputs:
            release_id: ${{ steps.plan.outputs.release_id }}
            release_tag: ${{ steps.plan.outputs.release_tag }}
            release_name: ${{ steps.plan.outputs.release_name }}
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
            - name: Reserve a protected prerelease draft
              id: plan
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INTERNAL_TEST: ${{ inputs.internal_test }}
                  INTERNAL_NUMBER: ${{ inputs.internal_number }}
                  PUBLIC_BETA: ${{ inputs.public_beta }}
                  BETA_NUMBER: ${{ inputs.beta_number }}
              run: node scripts/prepare-internal-release.js

    build:
        needs: [prepare]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: windows-2022
                      target: x86_64-pc-windows-msvc
                      bundles: msi,nsis
                      expected: msi,exe
                    - platform: macos-26
                      target: aarch64-apple-darwin
                      bundles: app,dmg
                      expected: app,dmg
                    - platform: macos-26-intel
                      target: x86_64-apple-darwin
                      bundles: app,dmg
                      expected: app,dmg

        runs-on: ${{ matrix.platform }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
                  key: release-${{ matrix.target }}

            - name: Install frontend dependencies
              run: npm ci

            - name: Build and upload desktop bundles
              id: tauri
              uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  releaseId: ${{ needs.prepare.outputs.release_id }}
                  tagName: ${{ needs.prepare.outputs.release_tag }}
                  releaseName: ${{ needs.prepare.outputs.release_name }}
                  releaseCommitish: ${{ github.sha }}
                  releaseBody: ${{ inputs.public_beta && 'Unsigned public beta candidate. Keep draft until independent artifact verification completes. Formal production-release acceptance is NOT complete; signing, notarization and clean-device/platform acceptance remain pending.' || inputs.internal_test && 'Unsigned internal test only. Formal release acceptance is NOT complete. Windows signing, macOS notarization, clean-device install/upgrade/data-retention/rollback checks remain pending. Do not treat this draft as a public release.' || 'Download the installer for your operating system from the assets below.' }}
                  releaseDraft: true
                  prerelease: ${{ inputs.internal_test == true || inputs.public_beta == true }}
                  generateReleaseNotes: true
                  uploadUpdaterJson: false
                  uploadWorkflowArtifacts: true
                  workflowArtifactNamePattern: easyproject-[version]-[platform]-[arch]-[bundle]
                  releaseAssetNamePattern: EasyProject_[version]_[platform]_[arch][setup][ext]
                  retryAttempts: 1
                  args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci

            - name: Validate generated bundles
              env:
                  EXPECTED_BUNDLES: ${{ matrix.expected }}
              run: node scripts/check-release-artifacts.js
