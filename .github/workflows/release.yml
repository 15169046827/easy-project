name: Release desktop

on:
    push:
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    validate:
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Verify audit standard
              run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-audit-standard.ps1

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Install frontend dependencies
              run: npm ci

            - name: Validate release metadata
              run: npm run release:check

            - name: Run frontend quality gate
              run: npm run lint

            - name: Check frontend types
              run: npm run typecheck

            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high

            - name: Run frontend tests
              run: npm test

            - name: Run 1000-task performance baseline
              run: npm run test:performance

            - name: Build frontend
              run: npm run build

            - name: Run browser smoke tests
              run: npm run test:e2e:production

            - name: Check Rust formatting
              working-directory: src-tauri
              run: cargo fmt --check

            - name: Check Rust coding conventions
              working-directory: src-tauri
              run: cargo clippy --all-targets --locked -- -D warnings

            - name: Test Rust
              working-directory: src-tauri
              run: cargo test --locked

    rust-security:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Install RustSec scanner
              run: cargo install cargo-audit --version 0.22.2 --locked

            - name: Populate complete crates.io index
              run: cargo fetch --locked
              working-directory: src-tauri

            - name: Audit Rust dependencies
              run: cargo audit --file src-tauri/Cargo.lock --deny yanked

    build:
        needs: [validate, rust-security]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: windows-2022
                      target: x86_64-pc-windows-msvc
                      bundles: msi,nsis
                      expected: msi,exe
                    - platform: macos-26
                      target: aarch64-apple-darwin
                      bundles: app,dmg
                      expected: app,dmg
                    - platform: macos-26-intel
                      target: x86_64-apple-darwin
                      bundles: app,dmg
                      expected: app,dmg

        runs-on: ${{ matrix.platform }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
                  key: release-${{ matrix.target }}

            - name: Install frontend dependencies
              run: npm ci

            - name: Build and upload desktop bundles
              id: tauri
              uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: v__VERSION__
                  releaseName: EasyProject v__VERSION__
                  releaseBody: Download the installer for your operating system from the assets below.
                  releaseDraft: true
                  prerelease: false
                  generateReleaseNotes: true
                  uploadUpdaterJson: false
                  uploadWorkflowArtifacts: true
                  workflowArtifactNamePattern: easyproject-[version]-[platform]-[arch]-[bundle]
                  releaseAssetNamePattern: EasyProject_[version]_[platform]_[arch][setup][ext]
                  retryAttempts: 1
                  args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci

            - name: Validate generated bundles
              env:
                  EXPECTED_BUNDLES: ${{ matrix.expected }}
              run: node scripts/check-release-artifacts.js
