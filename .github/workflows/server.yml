name: Headless server

on:
    push:
        branches: [main, 'codex/**']
        paths:
            [
                'server/**',
                'src-tauri/src/common/**',
                'src-tauri/src/db/**',
                'src-tauri/src/models/**',
                'src-tauri/src/services/**',
                '.github/workflows/server.yml'
            ]
    pull_request:
        paths:
            [
                'server/**',
                'src-tauri/src/common/**',
                'src-tauri/src/db/**',
                'src-tauri/src/models/**',
                'src-tauri/src/services/**',
                '.github/workflows/server.yml'
            ]

permissions:
    contents: read

jobs:
    security:
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.90.0
            - uses: actions/cache@v4
              id: auditor
              with:
                  path: .tools/audit
                  key: ubuntu22-rust190-cargo-audit-0.22.2
            - name: Install pinned auditor
              if: steps.auditor.outputs.cache-hit != 'true'
              run: cargo install cargo-audit --version 0.22.2 --locked --root .tools/audit
            - name: Populate complete server index
              run: cargo fetch --manifest-path server/Cargo.toml --locked
            - name: Audit headless dependencies without desktop exceptions
              run: .tools/audit/bin/cargo-audit audit --file server/Cargo.lock --deny yanked
    server:
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.90.0
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: server
            - name: Format
              run: cargo fmt --manifest-path server/Cargo.toml --check
            - name: Strict static checks
              run: cargo clippy --manifest-path server/Cargo.toml --locked --all-targets -- -D warnings
            - name: Domain and authentication tests
              run: cargo test --manifest-path server/Cargo.toml --locked
            - name: Build headless Linux server
              run: cargo build --manifest-path server/Cargo.toml --release --locked
            - uses: actions/upload-artifact@v4
              with:
                  name: easyproject-server-linux-x64
                  path: server/target/release/easyproject-server
                  if-no-files-found: error
