name: Headless server

on:
    push:
        branches: [main, 'codex/**']
        paths:
            [
                'server/**',
                'src-tauri/src/common/**',
                'src-tauri/src/db/**',
                'src-tauri/src/models/**',
                'src-tauri/src/services/**',
                '.github/workflows/server.yml'
            ]
    pull_request:
        paths:
            [
                'server/**',
                'src-tauri/src/common/**',
                'src-tauri/src/db/**',
                'src-tauri/src/models/**',
                'src-tauri/src/services/**',
                '.github/workflows/server.yml'
            ]

permissions:
    contents: read

jobs:
    server:
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.90.0
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: server
            - name: Format
              run: cargo fmt --manifest-path server/Cargo.toml --check
            - name: Strict static checks
              run: cargo clippy --manifest-path server/Cargo.toml --locked --all-targets -- -D warnings
            - name: Domain and authentication tests
              run: cargo test --manifest-path server/Cargo.toml --locked
            - name: Build headless Linux server
              run: cargo build --manifest-path server/Cargo.toml --release --locked
            - uses: actions/upload-artifact@v4
              with:
                  name: easyproject-server-linux-x64
                  path: server/target/release/easyproject-server
                  if-no-files-found: error
